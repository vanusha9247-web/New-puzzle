<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Birthday Puzzle for My Love ❤️</title>
    <style>
        :root {
            --bg: #fff0f3;
            --primary: #800f2f; 
            --accent: #ff4d6d; 
            --gold: #d4af37;
            --correct: #2d6a4f;
            --cell-size: 23px; 
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg);
            color: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            margin: 0;
            overflow-x: hidden;
        }

        header { text-align: center; margin-bottom: 10px; }
        h1 { font-size: 1.4rem; margin: 10px 0 0 0; }

        .grid-container {
            background: #222;
            padding: 8px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(128, 15, 47, 0.3);
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(16, var(--cell-size));
            grid-template-rows: repeat(16, var(--cell-size));
            gap: 1px;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .cell.active { background-color: white; }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            text-transform: uppercase;
            font-weight: 900;
            font-size: 15px;
            background: transparent;
            outline: none;
            color: #333;
            padding: 0;
            line-height: var(--cell-size);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell.correct { background-color: #d8f3dc !important; }
        .cell.correct input { color: var(--correct); }
        .cell.wrong { background-color: #ffccd5 !important; }

        .q-number {
            position: absolute;
            top: 0px;
            left: 1px;
            font-size: 7px;
            color: #999;
            font-family: Arial, sans-serif;
            pointer-events: none;
        }

        .clue-section {
            width: 92%;
            max-width: 450px;
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }

        .clue-item { margin-bottom: 12px; font-size: 13px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .controls { display: flex; gap: 8px; margin-top: 5px; }
        
        button {
            padding: 6px 12px;
            border-radius: 8px;
            border: none;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }

        .btn-hint { background: #fff0f3; color: var(--primary); border: 1px solid var(--accent); }
        .btn-reveal { background: var(--gold); color: white; }

        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(89, 13, 34, 0.9); z-index: 100;
        }
        
        .popup {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 25px; border-radius: 25px; z-index: 101;
            text-align: center; width: 80%; max-width: 320px;
            border: 4px solid var(--gold);
        }
    </style>
</head>
<body>

<header>
    <h1>Happy Birthday, My World! ❤️</h1>
</header>

<div class="grid-container">
    <div class="grid" id="main-grid"></div>
</div>

<div class="clue-section">
    <h3 style="margin-top:0">Clues</h3>
    <div id="clue-list"></div>
</div>

<div class="overlay" id="overlay"></div>
<div class="popup" id="popup">
    <h2 id="pop-title" style="color:var(--primary)"></h2>
    <p id="pop-msg" style="color:#444; line-height:1.4"></p>
    <button onclick="closePopup()" style="background:var(--primary); color:white; padding:12px 20px; font-size:14px; width:100%; border:none; border-radius:10px;">Next Word ❤️</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

<script>
    const puzzleData = [
        { id: 3, q: "The trip that changed everything", a: "CATALINAISLAND", r: 0, c: 9, d: "down", h: "Think of a boat ride and beautiful ocean views.", m: "That trip was magic! 🌊" },
        { id: 11, q: "Your way of saying 'I care'", a: "ACTIONS", r: 10, c: 4, d: "across", h: "These speak louder than words.", m: "I see your love in everything you do. ❤️" },
        { id: 9, q: "What you do when I'm upset", a: "LISTEN", r: 3, c: 6, d: "across", h: "You don't just hear me, you truly...", m: "Thank you for being my listener. 👂" },
        { id: 6, q: "What you do when you're stressed", a: "SILENCE", r: 8, c: 4, d: "across", h: "You go into your 'quiet zone'. Intersection at I.", m: "I'll always respect your peace. 🤫" },
        { id: 8, q: "The best decision of my life", a: "MARRYINGYOU", r: 5, c: 2, d: "across", h: "This happened on our wedding day!", m: "I'd say 'I Do' every single day! 💍" },
        { id: 5, q: "Your favorite comfort food", a: "SAMBAR", r: 12, c: 8, d: "across", h: "South Indian classic with idli/rice.", m: "Yum! My favorite comfort person. 🍛" },
        { id: 2, q: "Our favorite way to spend time", a: "LONGTALKS", r: 4, c: 11, d: "down", h: "We do this for hours, usually late at night.", m: "To infinity more midnight chats! 🌙" },
        { id: 4, q: "The nickname only I use for you", a: "SUBBU", r: 6, c: 13, d: "down", h: "The only word I say which is not your name.", m: "My one and only Subbu. 😘" },
        { id: 12, q: "The answer that connects everything", a: "LOVE", r: 5, c: 4, d: "down", h: "The 4-letter word that started it all.", m: "Love is our superpower. 🤟" },
        { id: 7, q: "What I see when I imagine my future", a: "US", r: 13, c: 2, d: "across", h: "Not me, not him, but...", m: "It's always been US. 👩‍❤️‍👨" },
        { id: 10, q: "What you give when I need it most", a: "TIME", r: 5, c: 2, d: "down", h: "You can't buy it, but you always share it.", m: "Thank you for every second. ⏳" },
        { id: 1, q: "The reason my bad days don't last", a: "YOU", r: 8, c: 11, d: "down", h: "Three letters, my whole world.", m: "You are my favorite medicine. ☀️" }
    ];

    const solvedWords = new Set();

    function init() {
        const grid = document.getElementById('main-grid');
        for (let i = 0; i < 16 * 16; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            const r = Math.floor(i / 16);
            const c = i % 16;
            cell.id = `c-${r}-${c}`;
            grid.appendChild(cell);
        }

        const list = document.getElementById('clue-list');
        puzzleData.forEach((w, idx) => {
            for (let i = 0; i < w.a.length; i++) {
                const r = w.d === 'across' ? w.r : w.r + i;
                const c = w.d === 'across' ? w.c + i : w.c;
                const cell = document.getElementById(`c-${r}-${c}`);
                cell.classList.add('active');
                if (!cell.querySelector('input')) {
                    const input = document.createElement('input');
                    input.maxLength = 1;
                    input.dataset.r = r;
                    input.dataset.c = c;
                    // Pre-fill first letter of each word
                    if (i === 0) { input.value = w.a[0]; cell.classList.add('correct'); }
                    input.addEventListener('input', (e) => validate(e, r, c));
                    input.addEventListener('keydown', (e) => handleNav(e, r, c));
                    cell.appendChild(input);
                }
                if (i === 0) {
                    const num = document.createElement('span');
                    num.className = 'q-number';
                    num.innerText = w.id;
                    cell.appendChild(num);
                }
            }

            const item = document.createElement('div');
            item.className = 'clue-item';
            item.innerHTML = `<strong>${w.id}.</strong> ${w.q} <div class="controls">
                <button class="btn-hint" onclick="pop('Hint', '${w.h.replace(/'/g, "\\'")}')">💡 Hint</button>
                <button class="btn-reveal" onclick="reveal(${idx})">✨ Reveal Letter</button></div>`;
            list.appendChild(item);
        });
    }

    function validate(e, r, c) {
        const char = e.target.value.toUpperCase();
        const correct = getCharAt(r, c);
        const cell = e.target.parentElement;
        if (char === correct) {
            cell.classList.add('correct');
            cell.classList.remove('wrong');
            moveFocus(r, c, 1);
        } else if (char !== "") {
            cell.classList.add('wrong');
        } else {
            cell.classList.remove('wrong');
        }
        checkSolved();
    }

    function getCharAt(r, c) {
        let finalChar = "";
        puzzleData.forEach(w => {
            for (let i = 0; i < w.a.length; i++) {
                const wr = w.d === 'across' ? w.r : w.r + i;
                const wc = w.d === 'across' ? w.c + i : w.c;
                if (wr == r && wc == c) finalChar = w.a[i];
            }
        });
        return finalChar;
    }

    function handleNav(e, r, c) {
        if (e.key === "Backspace" && e.target.value === "") moveFocus(r, c, -1);
    }

    function moveFocus(r, c, dir) {
        const allInputs = Array.from(document.querySelectorAll('.active input'));
        const idx = allInputs.findIndex(i => i.dataset.r == r && i.dataset.c == c);
        if (allInputs[idx + dir]) allInputs[idx + dir].focus();
    }

    function reveal(idx) {
        const w = puzzleData[idx];
        for (let i = 0; i < w.a.length; i++) {
            const r = w.d === 'across' ? w.r : w.r + i;
            const c = w.d === 'across' ? w.c + i : w.c;
            const input = document.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
            if (input && input.value === "") {
                input.value = w.a[i];
                input.parentElement.classList.add('correct');
                break;
            }
        }
        checkSolved();
    }

    function checkSolved() {
        puzzleData.forEach(w => {
            if (solvedWords.has(w.id)) return;
            let complete = true;
            for (let i = 0; i < w.a.length; i++) {
                const r = w.d === 'across' ? w.r : w.r + i;
                const c = w.d === 'across' ? w.c + i : w.c;
                const input = document.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
                if (input.value.toUpperCase() !== w.a[i]) complete = false;
            }
            if (complete) {
                solvedWords.add(w.id);
                if (solvedWords.size === puzzleData.length) {
                    confetti({ particleCount: 200, spread: 90, origin: { y: 0.6 } });
                    pop("🎉 YOU DID IT! 🎉", "HAPPY BIRTHDAY! You solved the puzzle of my heart. I love you endlessly! ❤️💍");
                } else {
                    confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
                    pop("Correct! 🥰", w.m);
                }
            }
        });
    }

    function pop(title, msg) {
        document.getElementById('pop-title').innerText = title;
        document.getElementById('pop-msg').innerText = msg;
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('popup').style.display = 'block';
    }

    function closePopup() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('popup').style.display = 'none';
    }

    init();
</script>
</body>
</html>
