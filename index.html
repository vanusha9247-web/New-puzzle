<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Birthday Surprise for Sai ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --cell: 35px;
            --yellow: #FFD700;
            --correct: #2ecc71;
            --wrong: #e74c3c;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 { font-family: 'Dancing Script', cursive; color: #ff4d6d; font-size: 3rem; margin-bottom: 20px; }

        #container { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }

        /* The Grid - Exact 15x17 range from your photo */
        #grid {
            display: grid;
            grid-template-columns: repeat(17, var(--cell));
            grid-template-rows: repeat(15, var(--cell));
            gap: 2px;
            background: #222;
            padding: 10px;
            border-radius: 8px;
        }

        .cell {
            width: var(--cell); height: var(--cell);
            background: white; border-radius: 3px;
            display: flex; align-items: center; justify-content: center;
            position: relative; color: black;
        }

        .cell input {
            width: 100%; height: 100%; border: none; text-align: center;
            font-size: 1.1rem; font-weight: bold; text-transform: uppercase;
            background: transparent; outline: none;
        }

        .num {
            position: absolute; top: 1px; left: 2px;
            font-size: 0.6rem; color: #888; pointer-events: none;
        }

        .empty { background: transparent !important; }
        .fixed { background: var(--yellow) !important; font-weight: bold; }
        .correct { background: var(--correct) !important; color: white !important; }
        .wrong { background: var(--wrong) !important; color: white !important; animation: shake 0.2s; }

        @keyframes shake { 0%,100% {transform:translateX(0);} 50% {transform:translateX(3px);} }

        #sidebar { width: 350px; background: #111; padding: 20px; border-radius: 12px; border: 1px solid #333; }
        .q-item { margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .q-btn { background: #ff4d6d; color: white; border: none; padding: 5px 12px; border-radius: 15px; cursor: pointer; font-size: 0.8rem; margin-top: 5px; }

        #overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center;
        }
        #popup {
            background: white; color: black; padding: 30px; border-radius: 20px;
            text-align: center; max-width: 350px;
        }
    </style>
</head>
<body>

    <h1>Happy Birthday, Sai! ❤️</h1>

    <div id="container">
        <div id="grid"></div>

        <div id="sidebar">
            <h3 style="color:#ff4d6d; margin-top:0;">Questions</h3>
            <div id="q-list"></div>
        </div>
    </div>

    <div id="overlay">
        <div id="popup">
            <h2 id="p-title" style="color:#ff4d6d">Message</h2>
            <p id="p-text"></p>
            <button onclick="closePop()" style="background:#ff4d6d; color:white; border:none; padding:10px 20px; border-radius:20px; cursor:pointer;">Close</button>
        </div>
    </div>

    <script>
        // Exact coordinate mapping from your Excel screenshot
        const puzzle = [
            {id: 1, r:0, c:7, a:"ACTIONS", dir:"h", q:"Your way of saying 'I care'", m:"You show me in everything you do! ✨"},
            {id: 2, r:2, c:5, a:"LISTEN", dir:"h", q:"What you do when I’m upset", m:"Thank you for hearing my heart. 👂"},
            {id: 3, r:7, c:5, a:"SILENCE", dir:"h", q:"What you do when you're stressed", m:"I'll always be your quiet peace. 🤫"},
            {id: 4, r:8, c:0, a:"MARRYINGYOU", dir:"h", q:"The best decision of my life", m: "I'd choose you every single time! 💍"},
            {id: 5, r:10, c:10, a:"SAMBAR", dir:"h", q:"Your favorite comfort food", m:"Warm and perfect, just like you! 🍛"},
            {id: 6, r:13, c:4, a:"LOVE", dir:"h", q:"The answer to everything", m:"I love you more than words, Sai! ❤️"},
            {id: 7, r:0, c:8, a:"CATALINAISLAND", dir:"v", q:"The trip that changed everything", m:"Our perfect emotional anchor. 🌊"},
            {id: 8, r:5, c:5, a:"YOU", dir:"v", q:"The reason my bad days end", m:"You're my sunshine! ☀️"},
            {id: 9, r:6, c:0, a:"TIME", dir:"v", q:"What you give when I need it most", m:"The most precious gift. ⏳"},
            {id: 10, r:11, c:7, a:"TALKS", dir:"v", q:"Our favorite way to spend the night", m:"I could talk to you forever. 💬"},
            {id: 11, r:7, c:14, a:"SUBBU", dir:"v", q:"The nickname meant only for you", m:"My favorite name for my favorite man! 🥰"},
            {id: 12, r:9, c:14, a:"US", dir:"v", q:"My favorite future vision", m:"It's always been us. 👩‍❤️‍👨"}
        ];

        // Specific Yellow Cells from your Image
        const yellowCells = ["0-8", "0-13", "2-5", "2-10", "7-5", "7-7", "7-10", "8-0", "8-5", "8-10", "8-14", "9-10", "10-16", "11-7", "13-10", "14-7"];
        
        const cellData = {};
        function buildMap() {
            puzzle.forEach(word => {
                for (let i = 0; i < word.a.length; i++) {
                    let r = word.dir === 'v' ? word.r + i : word.r;
                    let c = word.dir === 'h' ? word.c + i : word.c;
                    let key = `${r}-${c}`;
                    if (!cellData[key]) cellData[key] = { char: word.a[i], num: (i===0 ? word.id : null) };
                    else if (i===0) cellData[key].num = word.id;
                }
            });
        }

        function render() {
            const grid = document.getElementById('grid');
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 17; c++) {
                    const key = `${r}-${c}`;
                    const data = cellData[key];
                    const div = document.createElement('div');
                    div.className = 'cell ' + (data ? '' : 'empty');
                    
                    if (data) {
                        if (data.num) div.innerHTML = `<span class="num">${data.num}</span>`;
                        if (yellowCells.includes(key)) {
                            div.classList.add('fixed');
                            div.append(data.char);
                        } else {
                            const input = document.createElement('input');
                            input.maxLength = 1;
                            input.dataset.ans = data.char;
                            input.addEventListener('input', (e) => {
                                if (e.target.value.toUpperCase() === data.char) {
                                    div.classList.add('correct');
                                    checkWin();
                                } else if (e.target.value !== "") {
                                    div.classList.add('wrong');
                                    setTimeout(() => { div.classList.remove('wrong'); e.target.value = ""; }, 400);
                                }
                            });
                            div.appendChild(input);
                        }
                    }
                    grid.appendChild(div);
                }
            }
            
            const list = document.getElementById('q-list');
            puzzle.sort((a,b)=>a.id-b.id).forEach(w => {
                const div = document.createElement('div');
                div.className = 'q-item';
                div.innerHTML = `<div><strong>${w.id}.</strong> ${w.q}</div>
                                 <button class="q-btn" onclick="openPop('${w.m}')">View Hint Message</button>`;
                list.appendChild(div);
            });
        }

        function openPop(m) { document.getElementById('p-text').innerText = m; document.getElementById('overlay').style.display = 'flex'; }
        function closePop() { document.getElementById('overlay').style.display = 'none'; }
        
        function checkWin() {
            const inputs = Array.from(document.querySelectorAll('input'));
            if (inputs.every(i => i.value.toUpperCase() === i.dataset.ans)) {
                openPop("HAPPY BIRTHDAY SAI! 🎉 You solved our story. I love you forever!");
                startHearts();
            }
        }

        function startHearts() {
            setInterval(() => {
                const h = document.createElement('div');
                h.innerHTML = '❤️'; h.style.position = 'fixed';
                h.style.left = Math.random() * 100 + 'vw'; h.style.top = '100vh';
                document.body.appendChild(h);
                h.animate([{transform:'translateY(0)'}, {transform:'translateY(-110vh)'}], 3000);
            }, 100);
        }

        buildMap();
        render();
    </script>
</body>
</html>
