<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, My Love! ❤️</title>
    <style>
        :root {
            --bg: #fff0f3;
            --primary: #800f2f; 
            --accent: #ff4d6d; 
            --gold: #d4af37;
            --correct: #2d6a4f;
            --wrong: #c9184a;
        }

        body {
            font-family: 'Courier New', Courier, monospace; /* Monospace helps with letter alignment */
            background-color: var(--bg);
            color: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
        }

        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 2.2rem; margin-bottom: 5px; color: var(--primary); text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }

        /* Grid Styling */
        .grid-container {
            background: #222;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(128, 15, 47, 0.3);
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(16, 32px);
            grid-template-rows: repeat(15, 32px);
            gap: 1px;
        }

        .cell {
            width: 32px;
            height: 32px;
            background-color: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell.active { background-color: white; }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            text-transform: uppercase;
            font-weight: 900;
            font-size: 20px;
            background: transparent;
            outline: none;
            color: #333;
            /* Critical fix for letter alignment */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 32px; 
        }

        .cell.correct { background-color: #d8f3dc !important; transition: background 0.5s; }
        .cell.correct input { color: var(--correct); }
        .cell.wrong { background-color: #ffccd5 !important; }

        .q-number {
            position: absolute;
            top: 1px;
            left: 2px;
            font-size: 9px;
            color: #999;
            font-family: Arial, sans-serif;
        }

        /* Clues */
        .clue-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 20px;
        }

        .clue-item { margin-bottom: 15px; border-left: 3px solid var(--accent); padding-left: 10px; }
        
        button {
            padding: 5px 10px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 11px;
            margin-top: 5px;
            font-weight: bold;
        }

        .btn-hint { background: #fdf0d5; color: #780000; }
        .btn-reveal { background: #caf0f8; color: #03045e; margin-left: 5px; }

        /* Popups & Animations */
        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(89, 13, 34, 0.8); z-index: 100;
        }
        
        .popup {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 40px; border-radius: 30px; z-index: 101;
            text-align: center; width: 80%; max-width: 400px;
            box-shadow: 0 0 30px var(--gold);
        }

        .popup h2 { font-family: 'Segoe UI', sans-serif; color: var(--primary); margin-top: 0; }

        /* Animation Canvas */
        #canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 150;
        }

        @media (max-width: 600px) {
            .grid-container { overflow-x: auto; max-width: 95vw; }
            .grid { grid-template-columns: repeat(16, 28px); grid-template-rows: repeat(15, 28px); }
            .cell { width: 28px; height: 28px; }
            .clue-section { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<header>
    <h1>HBD to my better half! 🎂</h1>
    <p style="color:var(--accent)">Solve the puzzle to see your message...</p>
</header>

<div id="game-container">
    <div class="grid-container">
        <div class="grid" id="main-grid"></div>
    </div>

    <div class="clue-section">
        <div class="clue-group">
            <h3 style="color:var(--primary)">Across</h3>
            <div id="across-clues"></div>
        </div>
        <div class="clue-group">
            <h3 style="color:var(--primary)">Down</h3>
            <div id="down-clues"></div>
        </div>
    </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="popup" id="popup">
    <h2 id="pop-title">Yay! 🥰</h2>
    <p id="pop-msg" style="font-size: 1.2rem; color: #555;"></p>
    <button onclick="closePopup()" style="font-size:16px; padding: 12px 25px; background:var(--primary); color:white;">Keep Playing ❤️</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

<script>
    const puzzleData = [
        { id: 11, q: "Your way of saying 'I care'", a: "ACTIONS", r: 1, c: 8, d: "across", h: "These speak louder than words.", m: "You always show me love through what you do! ❤️" },
        { id: 3, q: "The trip that changed everything for us", a: "CATALINAISLAND", r: 1, c: 9, d: "down", h: "Think of a boat ride and beautiful ocean views.", m: "That trip was the start of forever! 🌊" },
        { id: 9, q: "What you do when I'm upset", a: "LISTEN", r: 3, c: 6, d: "across", h: "You don't just hear me, you truly...", m: "Thank you for always being my safe space to talk. 👂✨" },
        { id: 12, q: "The answer that connects everything", a: "LOVE", r: 5, c: 4, d: "down", h: "The 4-letter word that started it all.", m: "It's the foundation of us! 🤟" },
        { id: 7, q: "What I see when I imagine my future", a: "US", r: 5, c: 6, d: "down", h: "Not me, not him, but...", m: "The best team ever! 👩‍❤️‍👨" },
        { id: 6, q: "What you do when you're stressed", a: "SILENCE", r: 6, c: 6, d: "across", h: "You go into your 'quiet zone'.", m: "I'll always be there to share the quiet with you. 🤫❤️" },
        { id: 2, q: "Our favorite way to spend time together", a: "LONGTALKS", r: 5, c: 8, d: "down", h: "We do this for hours, usually late at night.", m: "I could talk to you until the sun comes up! 🌙" },
        { id: 4, q: "The nickname only I use for you", a: "SUBBU", r: 6, c: 13, d: "down", h: "The only word I say to call you that isn't your actual name.", m: "Only you get to be my Subbu! 😘" },
        { id: 8, q: "The best decision of my life", a: "MARRYINGYOU", r: 8, c: 3, d: "across", h: "This happened on our wedding day!", m: "I'd choose you a million times over! 💍" },
        { id: 1, q: "The reason my bad days don't last long", a: "YOU", r: 8, c: 12, d: "down", h: "Three letters, my whole world.", m: "You are my sunshine on a cloudy day! ☀️" },
        { id: 10, q: "What you give when I need it most", a: "TIME", r: 8, c: 3, d: "down", h: "You can't buy it, but you always share it with me.", m: "The most precious gift you give me. ⏳❤️" },
        { id: 5, q: "Your favorite comfort food", a: "SAMBAR", r: 10, c: 10, d: "across", h: "A South Indian classic, usually served hot with idli or rice.", m: "Delicious! Just like our life together. 🍛" }
    ];

    const solvedWords = new Set();

    function initGrid() {
        const grid = document.getElementById('main-grid');
        for (let i = 0; i < 15 * 16; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            const r = Math.floor(i / 16);
            const c = i % 16;
            cell.id = `c-${r}-${c}`;
            grid.appendChild(cell);
        }

        puzzleData.forEach(word => {
            for (let i = 0; i < word.a.length; i++) {
                const r = word.d === 'across' ? word.r : word.r + i;
                const c = word.d === 'across' ? word.c + i : word.c;
                const cell = document.getElementById(`c-${r}-${c}`);
                cell.classList.add('active');
                
                if (!cell.querySelector('input')) {
                    const input = document.createElement('input');
                    input.maxLength = 1;
                    input.dataset.r = r;
                    input.dataset.c = c;
                    
                    if (i === 0) { input.value = word.a[0]; cell.classList.add('correct'); }

                    input.addEventListener('input', (e) => validate(e, r, c));
                    input.addEventListener('keydown', (e) => handleNav(e, r, c));
                    cell.appendChild(input);
                }
                if (i === 0) {
                    const span = document.createElement('span');
                    span.className = 'q-number';
                    span.innerText = word.id;
                    cell.appendChild(span);
                }
            }
            const list = document.getElementById(`${word.d}-clues`);
            const div = document.createElement('div');
            div.className = 'clue-item';
            div.innerHTML = `<strong>${word.id}.</strong> ${word.q}
                <div class="controls">
                    <button class="btn-hint" onclick="alert('Hint: ${word.h}')">💡 Hint</button>
                    <button class="btn-reveal" onclick="revealLetter('${word.a}', ${word.r}, ${word.c}, '${word.d}')">✨ Magic</button>
                </div>`;
            list.appendChild(div);
        });
    }

    function validate(e, r, c) {
        const val = e.target.value.toUpperCase();
        const expected = getCorrectChar(r, c);
        if (val === expected) {
            e.target.parentElement.classList.add('correct');
            moveFocus(r, c, 1);
        } else {
            e.target.parentElement.classList.remove('correct');
        }
        checkProgress();
    }

    function getCorrectChar(r, c) {
        let char = "";
        puzzleData.forEach(w => {
            for (let i = 0; i < w.a.length; i++) {
                let wr = w.d === 'across' ? w.r : w.r + i;
                let wc = w.d === 'across' ? w.c + i : w.c;
                if (wr === r && wc === c) char = w.a[i];
            }
        });
        return char;
    }

    function handleNav(e, r, c) {
        if (e.key === "Backspace" && e.target.value === "") moveFocus(r, c, -1);
    }

    function moveFocus(r, c, dir) {
        const inputs = Array.from(document.querySelectorAll('.active input'));
        const idx = inputs.findIndex(i => i.dataset.r == r && i.dataset.c == c);
        if (inputs[idx + dir]) inputs[idx + dir].focus();
    }

    function revealLetter(ans, r, c, dir) {
        for (let i = 0; i < ans.length; i++) {
            let currR = dir === 'across' ? r : r + i;
            let currC = dir === 'across' ? c + i : c;
            let input = document.querySelector(`input[data-r="${currR}"][data-c="${currC}"]`);
            if (input && input.value === "") {
                input.value = ans[i];
                input.parentElement.classList.add('correct');
                break;
            }
        }
        checkProgress();
    }

    function checkProgress() {
        puzzleData.forEach((word, index) => {
            if (solvedWords.has(word.id)) return;
            let isComplete = true;
            for (let i = 0; i < word.a.length; i++) {
                let r = word.d === 'across' ? word.r : word.r + i;
                let c = word.d === 'across' ? word.c + i : word.c;
                let input = document.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
                if (input.value.toUpperCase() !== word.a[i]) isComplete = false;
            }
            if (isComplete) {
                solvedWords.add(word.id);
                if (solvedWords.size === puzzleData.length) {
                    launchFireworks();
                    showPopup("🎉 HAPPY BIRTHDAY! 🎉", "You solved the puzzle of my heart! I love you more than all these words combined! 💍💖");
                } else {
                    playRandomAnimation(index);
                    showPopup("Correct! 🥰", word.m);
                }
            }
        });
    }

    function playRandomAnimation(index) {
        if (index % 2 === 0) {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        } else {
            const duration = 2 * 1000;
            const end = Date.now() + duration;
            (function frame() {
              confetti({ particleCount: 2, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff4d6d', '#800f2f'] });
              confetti({ particleCount: 2, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff4d6d', '#800f2f'] });
              if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }
    }

    function launchFireworks() {
        var duration = 15 * 1000;
        var animationEnd = Date.now() + duration;
        var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };
        function randomInRange(min, max) { return Math.random() * (max - min) + min; }
        var interval = setInterval(function() {
            var timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) return clearInterval(interval);
            var particleCount = 50 * (timeLeft / duration);
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
        }, 250);
    }

    function showPopup(title, msg) {
        document.getElementById('pop-title').innerText = title;
        document.getElementById('pop-msg').innerText = msg;
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('popup').style.display = 'block';
    }

    function closePopup() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('popup').style.display = 'none';
    }

    initGrid();
</script>
</body>
</html>
