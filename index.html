<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, My Love! ❤️</title>
    <style>
        :root {
            --bg: #fff0f3;
            --primary: #800f2f; /* Deep Berry */
            --accent: #ff4d6d; /* Rose */
            --gold: #d4af37;
            --correct: #2d6a4f; /* Emerald Green */
            --wrong: #c9184a; /* Crimson Red */
            --cell-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 2.5rem; margin-bottom: 5px; color: var(--primary); }
        .subtitle { font-style: italic; color: var(--accent); }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 1000px;
            width: 100%;
        }

        .grid-container {
            background: #333;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(128, 15, 47, 0.2);
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(16, 30px);
            grid-template-rows: repeat(15, 30px);
            gap: 1px;
        }

        .cell {
            width: 30px;
            height: 30px;
            background-color: #1a1a1a;
            position: relative;
        }

        .cell.active { background-color: white; }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 16px;
            background: transparent;
            outline: none;
            color: #333;
        }

        .cell.correct { background-color: #d8f3dc !important; }
        .cell.correct input { color: var(--correct); }
        .cell.wrong { background-color: #ffccd5 !important; }
        .cell.wrong input { color: var(--wrong); }

        .q-number {
            position: absolute;
            top: 1px;
            left: 2px;
            font-size: 8px;
            color: #888;
            z-index: 5;
        }

        .clue-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .clue-group h3 { border-bottom: 2px solid var(--gold); padding-bottom: 5px; }

        .clue-item {
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.4;
        }

        .controls { margin-top: 5px; }
        
        button {
            padding: 4px 8px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 11px;
            transition: 0.2s;
            margin-right: 5px;
        }

        .btn-hint { background: var(--bg); color: var(--primary); border: 1px solid var(--accent); }
        .btn-reveal { background: var(--gold); color: white; }
        button:hover { opacity: 0.8; transform: scale(1.05); }

        /* Popups */
        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 100;
        }
        .popup {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 30px; border-radius: 20px; z-index: 101;
            text-align: center; max-width: 400px; border: 4px solid var(--gold);
        }
        .popup h2 { color: var(--primary); }
        .popup p { font-size: 1.1rem; line-height: 1.5; }

        @media (max-width: 600px) {
            .grid-container { overflow-x: auto; max-width: 95vw; }
            .clue-section { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <h1>Happy Birthday! 🎂</h1>
    <p class="subtitle">A little puzzle for my favorite person...</p>
</header>

<div id="game-container">
    <div class="grid-container">
        <div class="grid" id="main-grid"></div>
    </div>

    <div class="clue-section">
        <div class="clue-group">
            <h3>Across</h3>
            <div id="across-clues"></div>
        </div>
        <div class="clue-group">
            <h3>Down</h3>
            <div id="down-clues"></div>
        </div>
    </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="popup" id="popup">
    <h2 id="pop-title">Excellent! 🥰</h2>
    <p id="pop-msg"></p>
    <button onclick="closePopup()" style="font-size:16px; padding: 10px 20px; background:var(--primary); color:white;">Continue ❤️</button>
</div>

<script>
    const puzzleData = [
        { id: 11, q: "Your way of saying 'I care'", a: "ACTIONS", r: 1, c: 8, d: "across", h: "These speak louder than words." },
        { id: 3, q: "The trip that changed everything for us", a: "CATALINAISLAND", r: 1, c: 9, d: "down", h: "Think of a boat ride and beautiful ocean views." },
        { id: 9, q: "What you do when I'm upset", a: "LISTEN", r: 3, c: 6, d: "across", h: "You don't just hear me, you truly..." },
        { id: 12, q: "The answer that connects everything", a: "LOVE", r: 5, c: 4, d: "down", h: "The 4-letter word that started it all." },
        { id: 7, q: "What I see when I imagine my future", a: "US", r: 5, c: 6, d: "down", h: "Not me, not him, but..." },
        { id: 6, q: "What you do when you're stressed", a: "SILENCE", r: 6, c: 6, d: "across", h: "You go into your 'quiet zone'." },
        { id: 2, q: "Our favorite way to spend time together", a: "LONGTALKS", r: 5, c: 8, d: "down", h: "We do this for hours, usually late at night." },
        { id: 4, q: "The nickname only I use for you", a: "SUBBU", r: 6, c: 13, d: "down", h: "The only word I say to call you that isn't your actual name." },
        { id: 8, q: "The best decision of my life", a: "MARRYINGYOU", r: 8, c: 3, d: "across", h: "This happened on our wedding day!" },
        { id: 1, q: "The reason my bad days don't last long", a: "YOU", r: 8, c: 12, d: "down", h: "Three letters, my whole world." },
        { id: 10, q: "What you give when I need it most", a: "TIME", r: 8, c: 3, d: "down", h: "You can't buy it, but you always share it with me." },
        { id: 5, q: "Your favorite comfort food", a: "SAMBAR", r: 10, c: 10, d: "across", h: "A South Indian classic, usually served hot with idli or rice." }
    ];

    const solvedWords = new Set();
    const midMessages = [
        "You're too smart! That's correct! 🥰",
        "Every word solved is another reason I love you! ✨",
        "Nailed it, birthday boy! ❤️",
        "You know us so well... keep going! 🥂"
    ];

    function initGrid() {
        const grid = document.getElementById('main-grid');
        for (let i = 0; i < 15 * 16; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            const r = Math.floor(i / 16);
            const c = i % 16;
            cell.id = `c-${r}-${c}`;
            grid.appendChild(cell);
        }

        puzzleData.forEach(word => {
            for (let i = 0; i < word.a.length; i++) {
                const r = word.d === 'across' ? word.r : word.r + i;
                const c = word.d === 'across' ? word.c + i : word.c;
                const cell = document.getElementById(`c-${r}-${c}`);
                cell.classList.add('active');
                
                if (!cell.querySelector('input')) {
                    const input = document.createElement('input');
                    input.maxLength = 1;
                    input.dataset.r = r;
                    input.dataset.c = c;
                    
                    // Pre-fill first letter of each word
                    if (i === 0) {
                        input.value = word.a[0];
                        cell.classList.add('correct');
                    }

                    input.addEventListener('input', (e) => validate(e, word.a, i, r, c));
                    input.addEventListener('keydown', (e) => handleNav(e, r, c));
                    cell.appendChild(input);
                }
                if (i === 0) {
                    const span = document.createElement('span');
                    span.className = 'q-number';
                    span.innerText = word.id;
                    cell.appendChild(span);
                }
            }

            // Clue lists
            const list = document.getElementById(`${word.d}-clues`);
            const div = document.createElement('div');
            div.className = 'clue-item';
            div.innerHTML = `<strong>${word.id}.</strong> ${word.q}
                <div class="controls">
                    <button class="btn-hint" onclick="showHint('${word.h}')">💡 Hint</button>
                    <button class="btn-reveal" onclick="revealLetter('${word.a}', ${word.r}, ${word.c}, '${word.d}')">✨ Reveal</button>
                </div>`;
            list.appendChild(div);
        });
    }

    function validate(e, fullAnswer, idx, r, c) {
        const val = e.target.value.toUpperCase();
        const expected = getCorrectChar(r, c);
        const cell = e.target.parentElement;

        if (val === expected) {
            cell.classList.add('correct');
            cell.classList.remove('wrong');
            moveFocus(r, c, 1);
        } else if (val !== "") {
            cell.classList.add('wrong');
            cell.classList.remove('correct');
        }
        checkProgress();
    }

    function getCorrectChar(r, c) {
        let char = "";
        puzzleData.forEach(w => {
            for (let i = 0; i < w.a.length; i++) {
                let wr = w.d === 'across' ? w.r : w.r + i;
                let wc = w.d === 'across' ? w.c + i : w.c;
                if (wr === r && wc === c) char = w.a[i];
            }
        });
        return char;
    }

    function handleNav(e, r, c) {
        if (e.key === "Backspace" && e.target.value === "") {
            moveFocus(r, c, -1);
        }
    }

    function moveFocus(r, c, dir) {
        const inputs = Array.from(document.querySelectorAll('.active input'));
        const idx = inputs.findIndex(i => i.dataset.r == r && i.dataset.c == c);
        if (inputs[idx + dir]) inputs[idx + dir].focus();
    }

    function showHint(msg) {
        alert("Hint: " + msg);
    }

    function revealLetter(ans, r, c, dir) {
        for (let i = 0; i < ans.length; i++) {
            let currR = dir === 'across' ? r : r + i;
            let currC = dir === 'across' ? c + i : c;
            let input = document.querySelector(`input[data-r="${currR}"][data-c="${currC}"]`);
            if (input && input.value === "") {
                input.value = ans[i];
                input.parentElement.classList.add('correct');
                break;
            }
        }
        checkProgress();
    }

    function checkProgress() {
        puzzleData.forEach(word => {
            if (solvedWords.has(word.id)) return;
            let isComplete = true;
            for (let i = 0; i < word.a.length; i++) {
                let r = word.d === 'across' ? word.r : word.r + i;
                let c = word.d === 'across' ? word.c + i : word.c;
                let input = document.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
                if (input.value.toUpperCase() !== word.a[i]) isComplete = false;
            }
            if (isComplete) {
                solvedWords.add(word.id);
                if (solvedWords.size === puzzleData.length) {
                    showFinalPopup();
                } else {
                    const randomMsg = midMessages[Math.floor(Math.random() * midMessages.length)];
                    showPopup("Word Complete!", randomMsg);
                }
            }
        });
    }

    function showPopup(title, msg) {
        document.getElementById('pop-title').innerText = title;
        document.getElementById('pop-msg').innerText = msg;
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('popup').style.display = 'block';
    }

    function showFinalPopup() {
        const finalMsg = "HAPPY BIRTHDAY TO MY AMAZING HUSBAND! 🎂💖\n\nYou've solved the puzzle of my heart. Thank you for being my 'You', my 'Sambar' partner, and my favorite person to talk to until 2 AM.\n\nI love you more than all these words combined! 💍✨";
        showPopup("🎉 YOU DID IT! 🎉", finalMsg);
    }

    function closePopup() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('popup').style.display = 'none';
    }

    initGrid();
</script>

</body>
</html>
