<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Quest for Sai</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff85a1;
            --secondary: #fbb1bd;
            --correct: #74c69d;
            --wrong: #ff7096;
            --bg: #fff0f3;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            background: white;
            padding: 2rem;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 133, 161, 0.2);
            text-align: center;
            max-width: 90%;
            width: 500px;
            border: 5px solid var(--secondary);
            position: relative;
        }

        .character-img { font-size: 3.5rem; margin-bottom: 10px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        .clue { font-size: 1.1rem; font-weight: 700; color: #555; min-height: 50px; margin-bottom: 20px; }

        .answer-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .letter-box {
            width: 40px;
            height: 50px;
            border: 3px solid #eee;
            border-radius: 12px;
            font-size: 1.6rem;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            background: #fff;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
        }

        /* Logic Styles */
        .letter-box.correct { border-color: var(--correct); background-color: #d8f3dc; color: #2d6a4f; transform: scale(1.05); }
        .letter-box.wrong { border-color: var(--wrong); background-color: #ffe5ec; color: #a4133c; animation: shake 0.3s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .btn-group { display: flex; justify-content: center; gap: 15px; }
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-family: 'Fredoka One', cursive;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
        }
        .main-btn { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(255, 133, 161, 0.4); }
        .hint-btn { background: #9b5de5; color: white; }
        .skip-btn { background: #f0f0f0; color: #999; }

        /* Custom Overlays */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 133, 161, 0.4);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .popup {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            max-width: 80%;
            animation: popUp 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        @keyframes popUp { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

<div id="game-container">
    <div class="character-img" id="char-icon">🧸</div>
    <h1 style="font-family: 'Fredoka One'; color: var(--primary);">For My Sai ❤️</h1>
    <p id="clue-text" class="clue">Click below to start your birthday journey!</p>
    
    <div id="answer-slots" class="answer-container"></div>

    <div class="btn-group">
        <button id="main-btn" class="main-btn" onclick="handleMainAction()">Start Game</button>
        <button id="hint-btn" class="hint-btn" style="display:none" onclick="showHint()">Hint ✨</button>
        <button id="skip-btn" class="skip-btn" style="display:none" onclick="fakeSkip()">Skip</button>
    </div>
</div>

<div id="overlay" class="overlay">
    <div class="popup" id="popup-content">
        <h1 id="pop-emoji">✨</h1>
        <p id="pop-msg" style="font-size: 1.2rem; font-weight: bold;"></p>
        <button class="main-btn" onclick="closePopup()">Continue! 💖</button>
    </div>
</div>

<script>
    const questions = [
        { q: "The reason my bad days don’t last long", a: "YOU", hintMsg: "It's a 3-letter word for my favorite person!", correctMsg: "Because you're my sunshine, Sai! ☀️" },
        { q: "Our favorite way to spend time together", a: "LONG TALKS", hintMsg: "We do this for hours and never get tired...", correctMsg: "I could listen to you forever... 💬" },
        { q: "The trip that changed everything for us", a: "CATALINA ISLAND", hintMsg: "Think of boats, golf carts, and blue water!", correctMsg: "That blue water had nothing on your eyes! 🌊💙" },
        { q: "The nickname only I use for you", a: "SUBBU", hintMsg: "It starts with S and ends with U!", correctMsg: "My one and only Subbu! 🥰" },
        { q: "Your favorite comfort food", a: "SAMBAR", hintMsg: "South Indian soul food!", correctMsg: "Adding spice to my life, just like Sambar! 🍲" },
        { q: "What you do when you’re stressed", a: "SILENCE", hintMsg: "You get very, very quiet...", correctMsg: "Even in your silence, I hear your heart. 🤍" },
        { q: "What I see when I imagine my future", a: "US", hintMsg: "Just two letters, you and me.", correctMsg: "Always and forever, Sai. 💍" },
        { q: "The best decision of my life", a: "MARRYING YOU", hintMsg: "The day we said 'I Do'!", correctMsg: "I'd say 'I Do' a million times over! ✨" },
        { q: "What you do when I’m upset", a: "LISTEN", hintMsg: "You give me your full attention.", correctMsg: "You're my safest place to land. 👂💗" },
        { q: "What you give when I need it most", a: "TIME", hintMsg: "You can't buy it, but you always give it to me.", correctMsg: "The most precious gift you give me. ⏳" },
        { q: "Your way of saying “I care”", a: "ACTIONS", hintMsg: "They speak louder than words!", correctMsg: "You show me love in every little thing. 🛠️❤️" },
        { q: "The answer that connects everything", a: "LOVE", hintMsg: "The strongest force between us.", correctMsg: "Happy Birthday, Sai! You are my whole world! 🎂❤️" }
    ];

    let currentQ = 0;
    let isGameActive = false;
    const icons = ["🧸", "🐱", "🐰", "🌸", "✨", "🐥"];

    function handleMainAction() {
        if (!isGameActive) {
            isGameActive = true;
            document.getElementById('main-btn').innerText = "Submit Answer";
            document.getElementById('hint-btn').style.display = "block";
            document.getElementById('skip-btn').style.display = "block";
            loadQuestion();
        } else {
            checkFinal();
        }
    }

    function loadQuestion() {
        const q = questions[currentQ];
        document.getElementById('clue-text').innerText = q.q;
        document.getElementById('char-icon').innerText = icons[currentQ % icons.length];
        
        const container = document.getElementById('answer-slots');
        container.innerHTML = '';
        
        let charIndex = 0;
        q.a.split('').forEach((char) => {
            if (char === ' ') {
                const space = document.createElement('div');
                space.style.width = '100%';
                container.appendChild(space);
            } else {
                const input = document.createElement('input');
                input.className = 'letter-box';
                input.maxLength = 1;
                input.dataset.index = charIndex;
                input.dataset.char = char;
                input.oninput = (e) => validateLetter(e.target);
                container.appendChild(input);
                charIndex++;
            }
        });
    }

    function validateLetter(input) {
        const val = input.value.toUpperCase();
        if (val === input.dataset.char) {
            input.className = 'letter-box correct';
            if (input.nextElementSibling) input.nextElementSibling.focus();
        } else if (val !== "") {
            input.className = 'letter-box wrong';
            setTimeout(() => { input.value = ""; input.className = 'letter-box'; }, 500);
        }
    }

    function showHint() {
        const q = questions[currentQ];
        document.getElementById('pop-emoji').innerText = "💡✨";
        document.getElementById('pop-msg').innerText = q.hintMsg;
        document.getElementById('overlay').style.display = 'flex';
        
        // Reveal one letter after hint is closed
        window.pendingHint = true;
    }

    function checkFinal() {
        const boxes = document.querySelectorAll('.letter-box');
        const allCorrect = Array.from(boxes).every(b => b.classList.contains('correct'));
        
        if (allCorrect) {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            document.getElementById('pop-emoji').innerText = "🌈💖";
            document.getElementById('pop-msg').innerText = questions[currentQ].correctMsg;
            document.getElementById('overlay').style.display = 'flex';
            window.isNextLevel = true;
        } else {
            alert("Fill in all the letters correctly first, my love! ❤️");
        }
    }

    function fakeSkip() {
        const msgs = ["No skipping allowed for the birthday boy! 😤", "Wait! The next one is your favorite! 🎀", "I put so much love into this, don't skip! 🥺"];
        document.getElementById('pop-emoji').innerText = "🚫🤭";
        document.getElementById('pop-msg').innerText = msgs[Math.floor(Math.random()*msgs.length)];
        document.getElementById('overlay').style.display = 'flex';
    }

    function closePopup() {
        document.getElementById('overlay').style.display = 'none';
        
        if (window.pendingHint) {
            revealOneLetter();
            window.pendingHint = false;
        }

        if (window.isNextLevel) {
            window.isNextLevel = false;
            currentQ++;
            if (currentQ < questions.length) {
                loadQuestion();
            } else {
                showFinalCelebration();
            }
        }
    }

    function revealOneLetter() {
        const boxes = document.querySelectorAll('.letter-box:not(.correct)');
        if (boxes.length > 0) {
            const firstEmpty = boxes[0];
            firstEmpty.value = firstEmpty.dataset.char;
            firstEmpty.className = 'letter-box correct';
        }
    }

    function showFinalCelebration() {
        document.getElementById('game-container').innerHTML = `
            <div class="character-img">🎊🎂🎈</div>
            <h1 style="color: var(--primary)">HAPPY BIRTHDAY SAI!</h1>
            <p style="font-weight:bold">You are the love of my life, my best friend, and my forever. Hope your day is as amazing as you are!</p>
            <div class="character-img">💑✨💖</div>
        `;
        setInterval(() => {
            confetti({ particleCount: 50, angle: 60, spread: 55, origin: { x: 0 } });
            confetti({ particleCount: 50, angle: 120, spread: 55, origin: { x: 1 } });
        }, 2000);
    }
</script>
</body>
</html>
